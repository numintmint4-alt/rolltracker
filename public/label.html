<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏷️ พิมพ์ป้ายม้วนกระดาษ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f2f5; padding: 16px; }
.container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 20px 24px 28px; }
.header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9edf4; padding-bottom: 14px; margin-bottom: 18px; }
.header h1 { font-size: 24px; color: #0b2b44; font-weight: 700; }
.header .btn { padding: 8px 20px; border-radius: 30px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn-secondary { background: #6c757d; color: #fff; } .btn-secondary:hover { background: #5a6268; }

.search-area {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: #f8faff; padding: 16px 20px; border-radius: 14px;
    border: 1px solid #e9edf4; margin-bottom: 16px;
}
.search-area label { font-weight: 600; color: #1a2a3a; font-size: 15px; }
.search-area .input-wrap { position: relative; flex: 1 1 260px; }
.search-area input {
    width: 100%; padding: 12px 18px; border: 2px solid #dce2ec;
    border-radius: 40px; font-size: 16px; outline: none;
    font-family: 'Sarabun', sans-serif;
}
.search-area input:focus { border-color: #1a4b6d; box-shadow: 0 0 0 4px rgba(26,75,109,0.12); }
.search-area .suggestions {
    position: absolute; top: 110%; left: 0; right: 0; background: #fff;
    border: 1px solid #dce2ec; border-radius: 12px; max-height: 200px;
    overflow-y: auto; z-index: 100; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}
.search-area .suggestions.show { display: block; }
.search-area .suggestions .item { padding: 10px 18px; cursor: pointer; border-bottom: 1px solid #f0f3f8; font-size: 14px; }
.search-area .suggestions .item:hover { background: #f0f4fa; }
.search-area .btn { padding: 12px 26px; border-radius: 40px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; }
.btn-search { background: #1a4b6d; color: #fff; } .btn-search:hover { background: #0b2b44; }
.btn-print { background: #28a745; color: #fff; } .btn-print:hover { background: #218838; }
.btn-print:disabled { opacity: 0.5; cursor: not-allowed; }

.preview-wrap {
    background: #e9edf4;
    padding: 20px;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 500px;
    overflow: auto;
}

/* ===== A5 Page ===== */
.label-page {
    width: 148mm;
    height: 210mm;
    padding: 4mm;
    box-sizing: border-box;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(5, 1fr);
    justify-content: center;
    align-content: center;
    font-family: 'Sarabun', sans-serif;
    color: #000;
    overflow: hidden;
}

/* ===== 1 Label ===== */
.label {
    border: 0.75pt solid #000;
    margin: -0.375pt;
    box-sizing: border-box;
    display: flex;
    overflow: hidden;
    background: #fff;
    width: 100%;
    height: 100%;
}

.label .main {
    flex: 1;
    display: grid;
    grid-template-rows: 11fr 8.8fr 8.8fr 6.7fr 6.7fr;
    min-width: 0;
    height: 100%;
}
.label .main > div {
    padding: 0 1.5mm;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    justify-content: center;      /* ⭐ กึ่งกลางแนวนอน (default) */
}

/* ⭐ กลุ่ม อยู่ขวา — rotate -90° */
.label .side {
    width: 11mm;
    border-left: 0.75pt solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    flex-shrink: 0;
    overflow: hidden;
}
.label .side span {
    transform: rotate(-90deg);
    white-space: nowrap;
    font-size: 15pt;
    font-weight: 500;
    letter-spacing: 0.5px;
    display: inline-block;
}

/* ⭐ เลขม้วน: กึ่งกลาง + ดาวอยู่ขวาสุด */
.label .roll-row {
    background: #e8e8e8;
    border-bottom: 0.75pt solid #000;
    font-size: 17pt;
    font-weight: 700;
    position: relative;            /* ⭐ ให้ .star ใช้ absolute ได้ */
    justify-content: center;       /* ⭐ เลขม้วนกึ่งกลาง */
    padding: 0 8mm;                /* ⭐ กันชนกับดาว */
}
.label .roll-row .star {
    font-size: 15pt;
    position: absolute;            /* ⭐ ติดขวาสุด */
    right: 1.5mm;
    top: 50%;
    transform: translateY(-50%);
}

/* ⭐ Grade + Size: กึ่งกลาง */
.label .grade-row {
    font-size: 15pt;
    font-weight: 600;
    border-bottom: 0.5pt solid #000;
    justify-content: center;
}

/* ⭐ Dia.: กึ่งกลาง */
.label .dia-row {
    font-size: 13pt;
    border-bottom: 0.5pt solid #000;
    justify-content: center;
}

/* ลงชื่อ + สถานที่: ชิดซ้าย (ตามเดิม) */
.label .sign-row {
    font-size: 9pt;
    border-bottom: 0.5pt solid #000;
    justify-content: flex-start;
    text-align: left;
}
.label .place-row {
    font-size: 9pt;
    justify-content: flex-start;
    text-align: left;
}

.placeholder {
    display: flex; align-items: center; justify-content: center;
    padding: 40px; color: #7a8a9e; font-size: 15px;
}

.toast { position: fixed; bottom: 24px; right: 24px; background: #1a2a3a; color: #fff; padding: 14px 24px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); font-weight: 500; z-index: 2000; }
.toast.success { background: #28a745; } .toast.error { background: #dc3545; } .toast.warning { background: #ffc107; color: #1a2a3a; }

@media print {
    @page { size: A5 portrait; margin: 0; }
    html, body {
        background: #fff;
        padding: 0;
        margin: 0;
        width: 148mm;
        height: 210mm;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container {
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        max-width: none;
        background: #fff;
        margin: 0;
        width: 148mm;
        height: 210mm;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .no-print { display: none !important; }
    .preview-wrap {
        padding: 0 !important;
        background: #fff !important;
        border-radius: 0 !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        overflow: hidden !important;
        width: 148mm !important;
        height: 210mm !important;
        min-height: 0 !important;
    }
    .label-page {
        box-shadow: none;
        page-break-after: auto !important;
        break-after: auto !important;
        margin: 0 auto;
        width: 148mm;
        height: 210mm;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="header no-print">
        <h1>🏷️ พิมพ์ป้ายม้วนกระดาษ</h1>
        <button class="btn btn-secondary" id="backBtn">← กลับหน้าตรวจนับ</button>
    </div>

    <div class="search-area no-print">
        <label for="rollInput">🔎 เลขม้วน</label>
        <div class="input-wrap">
            <input type="text" id="rollInput" placeholder="พิมพ์เลขม้วน..." autocomplete="off" />
            <div class="suggestions" id="suggestions"></div>
        </div>
        <button class="btn btn-search" id="searchBtn">🔍 ค้นหา</button>
        <button class="btn btn-print" id="printBtn" disabled>🖨️ พิมพ์ป้าย (10 ดวง)</button>
    </div>

    <div class="preview-wrap" id="previewWrap">
        <div class="placeholder" id="placeholder">พิมพ์เลขม้วนเพื่อดูตัวอย่างป้าย</div>
    </div>
</div>

<div id="toastContainer"></div>

<script>
let token = localStorage.getItem('rolltracker_token') || '';
let currentRoll = null;

const $ = id => document.getElementById(id);
const rollInput = $('rollInput');
const suggestions = $('suggestions');
const searchBtn = $('searchBtn');
const printBtn = $('printBtn');
const previewWrap = $('previewWrap');
const placeholder = $('placeholder');

function escHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function showToast(msg, type = 'info') {
    const c = document.createElement('div');
    c.className = `toast ${type}`;
    c.textContent = msg;
    $('toastContainer').appendChild(c);
    setTimeout(() => { c.style.opacity = '0'; c.style.transition = 'opacity 0.4s'; setTimeout(() => c.remove(), 500); }, 3000);
}

// ============ Suggest ============
let suggestTimeout;
rollInput.addEventListener('input', function() {
    const q = this.value.trim();
    clearTimeout(suggestTimeout);
    if (q.length < 1) { suggestions.classList.remove('show'); return; }
    suggestTimeout = setTimeout(async () => {
        try {
            const res = await fetch('/api/rolls/suggest?q=' + encodeURIComponent(q), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            if (Array.isArray(data) && data.length) {
                suggestions.innerHTML = data.map(s => `<div class="item" data-value="${escHtml(s)}">${escHtml(s)}</div>`).join('');
                suggestions.classList.add('show');
                suggestions.querySelectorAll('.item').forEach(el => {
                    el.addEventListener('click', function() {
                        rollInput.value = this.dataset.value;
                        suggestions.classList.remove('show');
                        doSearch();
                    });
                });
            } else suggestions.classList.remove('show');
        } catch (e) { suggestions.classList.remove('show'); }
    }, 200);
});
document.addEventListener('click', function(e) {
    if (!e.target.closest('.input-wrap')) suggestions.classList.remove('show');
});
rollInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { suggestions.classList.remove('show'); doSearch(); }
    if (e.key === 'Escape') suggestions.classList.remove('show');
});

// ============ Search ============
async function doSearch() {
    const q = rollInput.value.trim();
    if (!q) return;
    searchBtn.disabled = true;
    try {
        const res = await fetch('/api/rolls/search?q=' + encodeURIComponent(q), {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) {
            showToast('ไม่พบเลขม้วนนี้', 'error');
            currentRoll = null;
            printBtn.disabled = true;
            previewWrap.innerHTML = '<div class="placeholder">ไม่พบม้วนนี้ในระบบ</div>';
            return;
        }
        const data = await res.json();
        currentRoll = data.roll;
        renderPreview();
        printBtn.disabled = false;
    } catch (e) {
        showToast('เกิดข้อผิดพลาด', 'error');
    } finally {
        searchBtn.disabled = false;
    }
}
searchBtn.addEventListener('click', doSearch);

// ============ Render preview ============
function renderPreview() {
    if (!currentRoll) return;

    let gradeSize = '';
    const grade = (currentRoll.grade || '').trim();
    const width = (currentRoll.width || '').trim();
    if (grade && width) {
        gradeSize = `${grade}-${width}"`;
    } else if (grade) {
        gradeSize = grade;
    } else if (width) {
        gradeSize = `${width}"`;
    }

    const dia = currentRoll.dimeter ? `Dia. ${currentRoll.dimeter}` : 'Dia. —';
    const group = currentRoll.group_name || '';
    const rollNum = currentRoll.roll_number || '';

    const labelHtml = (idx) => `
        <div class="label">
            <div class="main">
                <div class="roll-row">
                    <span>${escHtml(rollNum)}</span>
                    ${idx === 0 ? '<span class="star">*</span>' : ''}
                </div>
                <div class="grade-row">${escHtml(gradeSize)}</div>
                <div class="dia-row">${escHtml(dia)}</div>
                <div class="sign-row">ลงชื่อจนท.บัญชี:</div>
                <div class="place-row">สถานที่พบ / กลุ่ม:</div>
            </div>
            <div class="side"><span>${escHtml(group)}</span></div>
        </div>
    `;

    let labels = '';
    for (let i = 0; i < 10; i++) labels += labelHtml(i);

    previewWrap.innerHTML = `<div class="label-page" id="labelPage">${labels}</div>`;
}

// ============ Print ============
printBtn.addEventListener('click', async () => {
    if (!currentRoll) return;
    try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        window.print();
    } catch (e) {
        showToast('เกิดข้อผิดพลาดในการพิมพ์', 'error');
    }
});

$('backBtn').addEventListener('click', () => { window.location.href = '/stock-check'; });

// ============ Auth check ============
(async function init() {
    try {
        const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) { window.location.href = '/'; return; }
    } catch (e) { window.location.href = '/'; }
})();

console.log('🏷️ Label Print v1.8 ready');
</script>
</body>
</html>
