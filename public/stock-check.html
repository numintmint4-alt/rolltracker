    <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 ตรวจนับสต็อกม้วนกระดาษ</title>
    <style>
        /* (คง CSS เดิมไว้ทั้งหมด) */

        /* ===== ปรับปรุงส่วน print ===== */
        @media print {
            .print-hide { display: none !important; }
            body { 
                background: #fff; 
                padding: 0; 
                margin: 0;
                font-size: 14px;
            }
            .container {
                box-shadow: none;
                border-radius: 0;
                padding: 10px 12px;
                max-width: 100%;
            }
            /* ซ่อนลายเซ็น */
            .signature-area { display: none !important; }
            /* ซ่อนสรุป */
            .summary { display: none !important; }
            /* ซ่อนหัวข้อ "ผู้ตรวจ" และช่องค้นหา */
            .header .user-info { display: none !important; }
            .search-box { display: none !important; }
            .page-controls { display: none !important; }
            .controls { display: none !important; }
            .filter-group { display: none !important; }
            .found-alert, .notfound-alert { display: none !important; }

            /* ปรับตารางให้พอดี A4 */
            .table-wrap {
                border: 1px solid #000;
                margin-top: 0;
                border-radius: 0;
                overflow: visible;
            }
            table {
                font-size: 13px;
                border-collapse: collapse;
                width: 100%;
                page-break-inside: auto;
            }
            table th {
                background: #e9edf4 !important;
                font-size: 13px;
                padding: 6px 8px;
                border: 1px solid #000;
            }
            table td {
                font-size: 13px;
                padding: 5px 8px;
                border: 1px solid #000;
            }
            .roll-number {
                font-weight: 700;
                font-size: 13px;
            }
            .checked-by { display: none; } /* ซ่อนคอลัมน์ผู้ตรวจ */
            /* หัวข้อหลัก */
            .header h1 {
                font-size: 18px;
                margin-bottom: 4px;
            }
            .header .meta {
                font-size: 14px;
            }
            /* ปรับ checkbox ใน PDF ให้เป็น □ */
            .found-checkbox {
                appearance: none;
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border: 2px solid #000;
                display: inline-block;
                position: relative;
                background: #fff;
                margin: 0;
                padding: 0;
                cursor: default;
            }
            .found-checkbox:checked::after {
                content: "✓";
                font-size: 14px;
                font-weight: 700;
                color: #000;
                position: absolute;
                top: -2px;
                left: 1px;
            }
            /* ซ่อนคอลัมน์ผู้ตรวจในตาราง */
            table th:last-child, table td:last-child {
                display: none;
            }
            /* ปรับ header ให้ไม่มี "ผู้จัดทำ" */
            .header .user-info { display: none; }
        }

        /* (คง CSS ที่เหลือไว้เหมือนเดิม) */
    </style>
</head>
<body>
    <!-- (HTML เหมือนเดิม) -->
    <div class="container" id="app">
        <!-- HEADER -->
        <div class="header">
            <h1>📋 ตรวจนับสต็อกม้วนกระดาษ</h1>
            <div class="meta" id="stockMeta">กำลังโหลด...</div>
            <div class="user-info" id="userInfo">👤 ผู้ตรวจ: —</div>
        </div>
        <!-- ... -->
    </div>
    <!-- scripts -->
    <script>
        // ... (JavaScript เดิม)

        // ---------- Export PDF (ปรับให้พิมพ์เฉพาะกลุ่มที่เลือก และทุก Size ของกลุ่มนั้น) ----------
        function exportPDF() {
            // เก็บค่าการกรองปัจจุบัน
            const currentGroupVal = groupFilter.value;
            const currentStatusVal = statusFilter.value;
            // เราไม่ต้องทำอะไรเพิ่ม เพราะ window.print() จะใช้ DOM ปัจจุบัน
            // แต่เราต้องการให้แสดงทุก Size ของกลุ่มที่เลือก (ไม่แยกหน้า)
            // ดังนั้นก่อนพิมพ์ เราจะปรับให้ currentGroup = กลุ่มที่เลือก, currentPage = 1 และ renderGroupedBySize() แบบรวมทุก Size
            // แต่เพื่อไม่ให้กระทบการแสดงผลบน Web เราจะทำการ clone DOM และปรับก่อนพิมพ์?
            // วิธีง่าย: ใช้ window.print() โดยที่ใน CSS @media print เราจะซ่อนส่วนแบ่งหน้า และแสดงทุก Size ในหน้าเดียว
            // เนื่องจากในหน้า Web เราแยกหน้าเป็น Size แต่เราสามารถปรับให้ในโหมด print มันแสดงทุก Size ของกลุ่มนั้น
            // โดยใช้ CSS @media print จัดการ visibility ของแต่ละขนาด? แต่ละขนาดอยู่ในหน้าต่างๆ กัน
            // วิธีการที่ดีกว่า: เมื่อกดปุ่ม Print ให้เราเปลี่ยนโหมดการแสดงผล (โดยไม่ต้อง reload) ให้แสดงทุก Size ของกลุ่มที่เลือก
            // แล้วค่อย print จากนั้นคืนค่า

            // เราใช้วิธี: สร้าง hidden div สำหรับ print เฉพาะ โดยใช้ JavaScript สร้าง iframe หรือ window.open
            // แต่เพื่อความรวดเร็ว เราใช้วิธี window.print() โดยปรับ CSS ให้แสดงทุก Size โดยใช้ display: block !important
            // และซ่อนปุ่มควบคุมหน้า

            // ง่ายที่สุด: ก่อนพิมพ์ ให้เราเรียกฟังก์ชัน renderAllSizesForPrint() ซึ่งจะ render ตารางรวมทุก Size ในหน้าปัจจุบัน
            // แต่ไม่ต้องเปลี่ยน DOM หลัก เพราะเราสามารถสร้างหน้าต่างใหม่สำหรับพิมพ์

            // เราใช้วิธี: เปิดหน้าต่างใหม่ (window.open) แล้วใส่ HTML ของตารางที่รวมทุก Size
            // แล้วเรียก print()

            // ได้เลย: ฟังก์ชันนี้จะสร้างหน้าต่างใหม่พร้อม HTML ที่ปรับให้เหมาะกับการพิมพ์
            const printWindow = window.open('', '_blank', 'width=900,height=700');
            if (!printWindow) {
                showToast('กรุณาอนุญาต pop-up เพื่อพิมพ์', 'warning');
                return;
            }

            // กรองข้อมูลตามกลุ่มและสถานะ
            let filtered = allRolls.filter(r => {
                if (currentGroup !== 'all' && (r.group_name || 'ไม่มีกลุ่ม') !== currentGroup) return false;
                if (currentStatusFilter !== 'all' && r.status !== currentStatusFilter) return false;
                return true;
            });

            // จัดกลุ่มตาม size และเรียงลำดับตาม size
            const sizeMap = {};
            filtered.forEach(r => {
                const size = r.width || '0';
                if (!sizeMap[size]) sizeMap[size] = [];
                sizeMap[size].push(r);
            });
            const sortedSizes = Object.keys(sizeMap).sort((a, b) => parseFloat(a) - parseFloat(b));

            // สร้างตารางรวมทุก Size
            let allRows = [];
            sortedSizes.forEach(size => {
                const rolls = sizeMap[size];
                // เรียงลำดับภายใน size ตาม location, status, grade
                rolls.sort((a, b) => {
                    const locA = a.loc || '';
                    const locB = b.loc || '';
                    if (locA !== locB) {
                        if (locA === 'LOC1') return -1;
                        if (locB === 'LOC1') return 1;
                        return locA.localeCompare(locB);
                    }
                    const statusOrder = { 'เต็ม': 0, 'เศษ': 1, 'รอกรอ': 2 };
                    const sA = statusOrder[a.status] ?? 99;
                    const sB = statusOrder[b.status] ?? 99;
                    if (sA !== sB) return sA - sB;
                    return (a.grade || '').localeCompare(b.grade || '');
                });
                allRows = allRows.concat(rolls);
            });

            // สร้าง HTML สำหรับพิมพ์
            const stockMetaText = stockMeta.textContent;
            const groupText = currentGroup !== 'all' ? currentGroup : 'ทั้งหมด';
            const statusText = currentStatusFilter !== 'all' ? currentStatusFilter : 'ทั้งหมด';

            let rowsHtml = '';
            allRows.forEach(roll => {
                const found = roll.found === 1;
                rowsHtml += `
                    <tr>
                        <td>${roll.loc || '—'}</td>
                        <td>${roll.status || '—'}</td>
                        <td>${roll.width ? roll.width + '"' : '—'}</td>
                        <td>${roll.grade || '—'}</td>
                        <td class="roll-number">${roll.roll_number || '—'}</td>
                        <td style="text-align:center;">${found ? '✓' : '□'}</td>
                        <td>${roll.dimeter || '—'}</td>
                        <td>${roll.kgs || '—'}</td>
                    </tr>
                `;
            });

            const printHtml = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>ตรวจนับสต็อก</title>
                <style>
                    * { box-sizing: border-box; margin: 0; padding: 0; }
                    body {
                        font-family: 'Segoe UI', system-ui, sans-serif;
                        padding: 10px 12px;
                        background: #fff;
                        font-size: 13px;
                    }
                    .header {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        border-bottom: 2px solid #000;
                        padding-bottom: 8px;
                        margin-bottom: 12px;
                    }
                    .header h1 { font-size: 18px; }
                    .header .meta { font-size: 14px; color: #333; }
                    .table-wrap {
                        border: 1px solid #000;
                        border-radius: 0;
                        overflow: visible;
                    }
                    table {
                        width: 100%;
                        border-collapse: collapse;
                        font-size: 13px;
                    }
                    table th {
                        background: #e9edf4;
                        font-weight: 700;
                        font-size: 13px;
                        padding: 6px 8px;
                        border: 1px solid #000;
                        text-align: left;
                    }
                    table td {
                        padding: 5px 8px;
                        border: 1px solid #000;
                        font-size: 13px;
                    }
                    .roll-number { font-weight: 700; }
                    .footer { margin-top: 20px; font-size: 12px; color: #555; }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>📋 ตรวจนับสต็อกม้วนกระดาษ</h1>
                    <div class="meta">${stockMetaText}</div>
                </div>
                <div style="margin-bottom:8px;font-size:14px;font-weight:500;">
                    กลุ่ม: ${groupText} | สถานะ: ${statusText}
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Location</th>
                                <th>สถานะ</th>
                                <th>Size</th>
                                <th>grade</th>
                                <th>เบอร์ม้วน</th>
                                <th>พบ/ไม่พบ</th>
                                <th>dimeter</th>
                                <th>kgs</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
                <div class="footer">พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}</div>
            </body>
            </html>
            `;

            printWindow.document.write(printHtml);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
            printWindow.close();
        }

        // แก้ไข event listener ปุ่ม PDF
        // exportPdfBtn ใช้ฟังก์ชัน exportPDF ใหม่
        // ในส่วน init ให้เปลี่ยน
        // document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);
        // (เราได้ตั้งไว้แล้ว)

        // ... (ส่วนอื่นๆ คงเดิม)
    </script>
</body>
</html>
